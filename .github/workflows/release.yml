name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable vMAJOR.MINOR.PATCH tag; got $RELEASE_TAG" >&2
            exit 1
          fi
      - name: Run package builder tests
        run: python -m unittest discover -s tests -p test_package_extension.py -v
      - name: Build extension ZIP
        id: package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          python scripts/package_extension.py --version "$RELEASE_TAG" --output-dir dist
          echo "zip_path=$(find dist -maxdepth 1 -name '*.zip' -print -quit)" >> "$GITHUB_OUTPUT"
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" \
            -f target_commitish="$GITHUB_SHA" --jq .body > generated-notes.md
          cat >> generated-notes.md <<'EOF'

          ## Compatibility

          Declared GNOME Shell versions: 49, 50, and 51. See the repository README for the
          distinction between declared support and runtime-tested compatibility.

          ## Install

          Download the attached ZIP, then install it with:

          ```sh
          gnome-extensions install --force material-panel@SakibShahariar-RELEASE.shell-extension.zip
          ```

          Replace `RELEASE` in the filename with the release version. Log out and back in
          if your GNOME session does not pick up the newly installed extension.
          EOF
          sed -i "s/RELEASE/$RELEASE_TAG/g" generated-notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ZIP_PATH="${{ steps.package.outputs.zip_path }}"
          gh release create "$RELEASE_TAG" "$ZIP_PATH" \
            --title "Material Panel $RELEASE_TAG" \
            --notes-file generated-notes.md
