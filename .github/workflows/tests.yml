name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-regressions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run calendar regression tests
        run: python -m unittest discover -s tests -v
